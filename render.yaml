# Render Infrastructure as Code (Blueprint) for Sewa Setu
# Automatically provisions the web application and managed PostgreSQL database.
#
# IMPORTANT ASSESSMENT AVAILABILITY NOTICE:
# - Assessment Requirement: The portal must remain accessible for assessor evaluation (~30 days).
# - Render Free PostgreSQL Policy: Free tier databases are automatically terminated/deleted after 30 days.
# - Render Free Web Service Policy: Free tier web services spin down after 15 minutes of inactivity
#   (causing ~50s cold-start delays that may cause automated evaluator probes to timeout).
# - Recommended Production Setting for Assessment:
#   Change 'plan: free' to 'plan: starter' ($7/mo each) for persistent 30+ day evaluation
#   without risk of database expiration or cold-start sleep.
#   If deploying on 'plan: free', set up an external health probe (e.g., UptimeRobot) pinging
#   https://<app>.onrender.com/health every 10 minutes, and note that Render will delete the DB at day 30.

services:
  - type: web
    name: sewasetu-portal
    runtime: docker
    dockerfilePath: app/Dockerfile
    dockerContext: app
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: assessor_admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sewasetu-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: GATEWAY_AUTH_TOKEN
        generateValue: true

databases:
  - name: sewasetu-db
    plan: free
    databaseName: sewasetu
    user: sewasetu
