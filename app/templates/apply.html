{% extends "base.html" %}
{% block content %}
<div class="steps"><b>Step 1 of 6:</b> Mobile Verification &rsaquo; Personal Details &rsaquo; Address &rsaquo; Bank Details &rsaquo; Document Upload &rsaquo; Declaration</div>
<h2>Mobile Verification</h2>
<form method="post" action="{{ url_for('apply') }}">
  <label for="mobile">Mobile Number</label>
  <input type="text" id="mobile" name="mobile" maxlength="10" placeholder="10 digit mobile number" autocomplete="off" required>
  <label for="captcha">Security Check: What is {{ captcha_q }}?</label>
  <input type="text" id="captcha" name="captcha" style="max-width:120px" autocomplete="off" required>
  <p><button class="btn btn-primary" type="submit">Send OTP &rarr;</button></p>
</form>
<p class="note">An OTP will be sent to your mobile number by SMS. OTP is valid for 5 minutes.</p>
{% endblock %}
