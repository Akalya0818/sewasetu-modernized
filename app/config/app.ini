; Sewa Setu configuration
; Consolidated from config/settings.ini, March 2026 (CR-2026-031)
; Note: Database passwords and secret keys MUST be provided via environment variables
; (DB_PASSWORD / POSTGRES_PASSWORD, SECRET_KEY, ADMIN_PASSWORD) in production.

[database]
host = db
port = 5432
name = sewasetu
user = sewasetu
; Database password must be supplied via DB_PASSWORD or POSTGRES_PASSWORD environment variable
password = 

[app]
; Application secret key must be supplied via SECRET_KEY environment variable
secret_key = 
sms_gateway_url = http://smsgw:8025
otp_validity_seconds = 300
upload_dir = /var/sewasetu/uploads
session_cookie_secure = false
session_cookie_samesite = Lax

[pension]
min_age = 60
sla_days = 15
scheme_deadline = 2026-10-31 23:59
